[project]
name = "spinbasis-2d"
version = "0.1.0"
description = "Spin-basis VMC (Jastrow / RBM / ViT) for the 2D J1-J2 Heisenberg model"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "importance-sampling-nqs",
    "jax[cuda]>=0.5.3",
    "matplotlib>=3.10.9",
]

[tool.uv.sources]
importance-sampling-nqs = { path = "../importance_sampling_nqs", editable = true }

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
